\* The repair Ticket's pull request needs a review only a person gives, so its pause waits on the person: the orchestrator stops, the pause stands, and a later orchestrator lifts it once the person approves and the repair lands.
CONSTANTS Orchs = {o1, o2}
          Env = {"review", "approve", "ostart", "timeout"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated PausedWhileACauseFails
PROPERTIES PushesBuildOnHead MergesOnlyRecordedHead NothingStartsWhilePaused AdoptsOnlyFromAStoppedHolder CheckInsEnd LiftedOnceFixed
