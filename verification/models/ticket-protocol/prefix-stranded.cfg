\* Pre-fix: an orchestrator stops after its run marks ready; the other's sort finds no category for that mark, so the Ticket is never landed.
CONSTANTS Orchs = {o1, o2}
          Env = {"ostop", "timeout"}
          PreFix = {"stranded"}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
PROPERTIES ReadyResolves
