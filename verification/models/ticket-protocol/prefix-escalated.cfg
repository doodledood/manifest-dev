CONSTANTS Orchs = {o1}
          Env = {"mark"}
          PreFix = {"escalated"}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS NoLandWhileEscalated
