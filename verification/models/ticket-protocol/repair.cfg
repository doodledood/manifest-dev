\* The repair Ticket for a check failing on the base, while a service goes down and comes back and a person adds and removes a Paused: line.
CONSTANTS Orchs = {o1}
          Env = {"ppause", "punpause", "outage", "up"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated PausedWhileACauseFails
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead NothingStartsWhilePaused RepairLifts
