\* An orchestrator stops for good after its launch, its run's timeout then passes, and a review only a person gives is required and given; the other orchestrator adopts a ready mark and lands it.
CONSTANTS Orchs = {o1, o2}
          Env = {"ostop", "timeout", "review", "approve"}
          PreFix = FALSE
          MaxRuns = 4
          Signpost = "none"
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES ReadyResolves HeldNotRedispatched PushesBuildOnHead MergesOnlyRecordedHead AdoptsOnlyFromAStoppedHolder
