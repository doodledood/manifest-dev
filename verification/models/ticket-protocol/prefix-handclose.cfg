\* Pre-fix: a person picks the Ticket and merges its pull request; only a landing turn records a merge, which their claim keeps the orchestrator from, and the picker records nothing.
CONSTANTS Orchs = {o1}
          Env = {"pick", "pmerge", "sort"}
          PreFix = {"handclose"}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
PROPERTIES PersonMergeIsRecorded
