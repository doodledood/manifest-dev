\* Two orchestrators, a takeover after a timeout, a moved base, and a commit a person pushed.
CONSTANTS Orchs = {o1, o2}
          Env = {"base", "push", "timeout"}
          PreFix = {}
          MaxRuns = 5
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead AdoptsOnlyFromAStoppedHolder
