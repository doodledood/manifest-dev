\* A person adds and removes a Paused: line while a service goes down and comes back.
CONSTANTS Orchs = {o1}
          Env = {"ppause", "punpause", "outage", "up"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated PausedWhileACauseFails
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead NothingStartsWhilePaused
