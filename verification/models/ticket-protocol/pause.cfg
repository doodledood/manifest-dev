\* A person adds and removes a Paused: line while a service goes down and comes back; two orchestrators, one of which may stop, so the other may adopt.
CONSTANTS Orchs = {o1, o2}
          Env = {"ppause", "punpause", "outage", "up", "ostop", "timeout"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated PausedWhileACauseFails
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead NothingStartsWhilePaused
