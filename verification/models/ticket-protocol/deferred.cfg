\* A deferred Ticket whose condition reads as unmet until the world makes it met; two orchestrators.
CONSTANTS Orchs = {o1, o2}
          Env = {"cond", "crash"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "unmet"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES LaunchedOnlyWhenMet ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead
