\* Every way a landing can fail to merge: a moved head, a moved base, a red check, a review a person then gives, a closed pull request.
CONSTANTS Orchs = {o1}
          Env = {"push", "base", "red", "review", "approve", "prclose"}
          PreFix = {}
          MaxRuns = 7
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES ReadyResolves HeldNotRedispatched PushesBuildOnHead MergesOnlyRecordedHead
