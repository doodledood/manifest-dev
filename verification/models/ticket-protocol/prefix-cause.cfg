\* Pre-fix: one orchestrator's pause per effort, so an outage beside a red base check goes unrecorded and the effort unpauses once the check is fixed.
CONSTANTS Orchs = {o1}
          Env = {"outage"}
          PreFix = {"percause"}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS PausedWhileACauseFails
