\* A person picks the Ticket and starts a hand run under their claim, which may die and whose timeout passes; two orchestrators.
CONSTANTS Orchs = {o1, o2}
          Env = {"pick", "crash", "timeout"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead NeverTakesAPick HandRunKeepsItsStartersClaim
