\* A person picks the Ticket, may mark it escalated and answer, starts a hand run under their claim, which may die and whose timeout passes, and may merge its pull request, which the orchestrator or a picker then records.
CONSTANTS Orchs = {o1}
          Env = {"pick", "crash", "timeout", "mark", "pmerge", "sort"}
          PreFix = {}
          MaxRuns = 4
          Signpost = "none"
          Hand = h
          Grant = "person"
          Writer = TRUE
          Repair = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead NeverTakesAPick HandRunKeepsItsStartersClaim PersonMergeIsRecorded
