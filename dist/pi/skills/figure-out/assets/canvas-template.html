<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>figure-out · survey sheet</title>
<!--
  ============================================================================
  figure-out canvas — TEMPLATE. A starting point, not a specification.
  ============================================================================

  WHAT THIS IS. A survey sheet for a figure-out session. The investigation is a
  plotted traverse across unmapped ground: stations fixed, chains drawn between
  them, the unsurveyed edge hachured. One red crosshair marks where we stand;
  nothing else on the sheet is red. Ground = the crux tree. Fog = territory,
  never nodes.

  ---------------------------------------------------------------------------
  REPLACE  — the session's own data. Everything between the DATA BEGINS and
  DATA ENDS markers in the script below:
     N        the stations, their points, and their attachments
     KIND     which kind each point is, keyed 'stationId:pointIndex'
     SESSION  artifacts the whole session produced (not any one station)
     FOG      the unsurveyed patch: its caption, its points, its attachments
     LS       the storage namespace — set it once per session, then never again
  The content below is a worked example on a throwaway topic, kept small on
  purpose. Replace it wholesale; do not pattern-match its topic.

  PRESERVE — the interaction shell: everything else. The computed layout, the
  station sheet, the accordion, note persistence, the bundle, pan/zoom/focus.
  Each piece guards against a real failure, so departing from it costs more
  than it looks. Two hard requirements the shell makes of the data:
     - exactly one station has state 'current' (the frontier)
     - every station id is stable, declared, and independent of its changing
       role, because notes key off identity while focus follows current state

  ---------------------------------------------------------------------------
  WHY IT IS BUILT THIS WAY.

  Layout is computed (layered, parent-barycentre, collision-resolved) then
  fitted — never hand-placed, so stations cannot collide and the tree can grow
  between turns without re-authoring positions.

  Notes live in localStorage under stable station ids, never in this file, so
  rewriting the file to show new ground never destroys what the user wrote.
  This is why LS is fixed for the session rather than fresh per artifact.

  One detail opens at a time and every point rests as a single line, because
  the whole point of the sheet is that it never arrives as a wall of text.

  No network, no build step, no server: it opens from a bare file path.
-->
<style>
/* ============ tokens ============
   Paper slips on an ink field: the sheet is dark, the station plates are light.
   ink      #070c16  sheet ground        paper  #e7ebe8  plate surface (settled)
   chalk    #dfe8f4  text on the field   slate  #1b2a27  text on a plate
   grap     #6d7f99  labels, secondary   vellum #f3e7ca  plate surface (open)
   survey   #79cfc0  surveyed chains     brass  #cfa14b  open questions
   redink   #f2543d  the current station, and nothing else
*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#070c16;color:#dfe8f4;
 font:400 15px/1.55 -apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;
 -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
 font-variant-numeric:tabular-nums}
button,textarea{font:inherit}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #79cfc0;outline-offset:3px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ============ title block ============ */
#top{flex:0 0 auto;display:flex;align-items:flex-end;gap:20px;padding:16px 26px 12px;
 border-bottom:1px solid rgba(125,145,175,.14)}
#eyebrow{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:#5d708c}
#artchip{font:inherit;letter-spacing:.16em;background:rgba(127,168,216,.13);color:#8fb4dd;border:0;
 border-radius:99px;padding:3px 9px;margin-left:9px;cursor:pointer;position:relative;
 box-shadow:0 0 0 1px rgba(127,168,216,.28);
 transition-property:background,color;transition-duration:.14s}
#artchip:hover{background:rgba(127,168,216,.24);color:#d3e5f7}
#artchip.hasnote{background:rgba(242,84,61,.18);color:#ffb2a4;font-weight:700}
#artchip::after{content:'';position:absolute;inset:-9px}
#title{font-size:17px;font-weight:650;letter-spacing:-.15px;color:#eef4fb;text-wrap:balance;margin-top:3px}
#keys{font-size:11px;letter-spacing:.06em;color:#586883;padding-bottom:2px}
#keys kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#94a6c0;
 border:1px solid rgba(125,145,175,.22);border-radius:4px;padding:1.5px 4.5px;margin:0 1px}

/* ============ the sheet ============ */
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-image:linear-gradient(rgba(125,145,175,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(125,145,175,.07) 1px,transparent 1px),
  radial-gradient(1000px 680px at 62% 44%,rgba(38,62,98,.34),transparent 74%);background-size:44px 44px,44px 44px,100% 100%}
#stage.drag{cursor:grabbing}
#stage::after{content:'';position:absolute;inset:14px;border:1px solid rgba(125,145,175,.10);
 border-radius:3px;pointer-events:none}
#layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#chains{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;
 transition:opacity .35s cubic-bezier(.2,0,0,1)}
#chains path{fill:none;stroke-linecap:round}
.ch-done{stroke:#79cfc0;stroke-opacity:.6;stroke-width:1.6;stroke-dasharray:13 5 2.5 5}
.ch-open{stroke:#cfa14b;stroke-opacity:.62;stroke-width:1.5;stroke-dasharray:2.5 6}
.ch-dead{stroke:#4a5a76;stroke-opacity:.45;stroke-width:1.1;stroke-dasharray:2 7}
.ch-live{stroke:#f2543d;stroke-opacity:.85;stroke-width:2.2}
.ch-fog{stroke:#6d7f99;stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:1.5 7}
.flow{stroke:#ffb9ad;stroke-opacity:.9;stroke-width:2.2;stroke-dasharray:5 15;animation:flow 1.15s linear infinite}
@keyframes flow{to{stroke-dashoffset:-40}}

/* ---- stations ---- */
.st{position:absolute;cursor:pointer;opacity:0;
 transition-property:opacity,transform,filter;transition-duration:.42s,.2s,.35s;
 transition-timing-function:cubic-bezier(.2,0,0,1)}
.st.in{opacity:1}
.plate{position:relative;height:100%;border-radius:12px;padding:11px 13px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#e7ebe8,#d6dcd9);box-shadow:0 0 0 1px rgba(0,0,0,.16),0 14px 28px -14px rgba(0,0,0,.85)}
.st:hover{transform:translateY(-2px)}
.st:hover .plate{box-shadow:0 0 0 1px rgba(0,0,0,.3),0 20px 36px -16px rgba(0,0,0,.9)}
.st .eb{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.19em;
 text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:6px}
.st .tick{width:13px;height:13px;border-radius:4px;display:grid;place-items:center;font-size:9px;
 line-height:1;flex:0 0 auto}
.st .lbl{font-size:13.5px;font-weight:600;line-height:1.36;text-wrap:pretty}
.st .note{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:99px;background:#cfa14b;box-shadow:0 0 0 2.5px #d6dcd9;display:none}
.st.hasnote .note{display:block}

.st.settled .eb{color:#2f7568}
.st.settled .tick{background:rgba(47,117,104,.14);color:#226256}
.st.settled .lbl{color:#1b2a27}
.st.open .eb{color:#8a6410}
.st.open .tick{background:rgba(138,100,16,.15);color:#7a570c}
.st.open .lbl{color:#3a2d10}
.st.ruled{opacity:0}
.st.ruled.in{opacity:.5}
.st.ruled .eb{color:#3f4b5c}
.st.ruled .tick{background:rgba(63,75,92,.16);color:#3f4b5c}
.st.ruled .lbl{color:#2b3542;text-decoration:line-through;text-decoration-color:rgba(43,53,66,.6)}

/* the one station that is fully lit */
.st.current{z-index:8}
.st.current .plate{background:linear-gradient(180deg,#ffffff,#f2f4f6);border-radius:14px;box-shadow:0 0 0 2px #f2543d,0 0 0 9px rgba(242,84,61,.14),0 34px 72px -20px rgba(0,0,0,1)}
.st.current .eb{color:#c22e19}
.st.current .tick{background:rgba(242,84,61,.16);color:#c22e19}
.st.current .lbl{font-size:16.5px;color:#101418;line-height:1.3;letter-spacing:-.15px}
.st.current .rd{font-size:11.5px;color:#8a5a2c;display:flex;align-items:center;gap:5px;margin-top:1px}
/* plotted crosshair — the sheet's signature mark */
.cross{position:absolute;inset:-19px;pointer-events:none;opacity:0;
 transition:opacity .5s cubic-bezier(.2,0,0,1)}
.st.current.in .cross{opacity:1}
.cross i{position:absolute;background:#f2543d}
.cross i:nth-child(1){left:50%;top:-9px;width:1px;height:16px;transform:translateX(-.5px)}
.cross i:nth-child(2){left:50%;bottom:-9px;width:1px;height:16px;transform:translateX(-.5px)}
.cross i:nth-child(3){top:50%;left:-9px;height:1px;width:16px;transform:translateY(-.5px)}
.cross i:nth-child(4){top:50%;right:-9px;height:1px;width:16px;transform:translateY(-.5px)}
.cross u{position:absolute;width:9px;height:9px;border:1px solid #f2543d;border-radius:0}
.cross u:nth-of-type(1){left:0;top:0;border-right:0;border-bottom:0}
.cross u:nth-of-type(2){right:0;top:0;border-left:0;border-bottom:0}
.cross u:nth-of-type(3){left:0;bottom:0;border-right:0;border-top:0}
.cross u:nth-of-type(4){right:0;bottom:0;border-left:0;border-top:0}
.halo{position:absolute;inset:-19px;border:1px solid rgba(242,84,61,.30);border-radius:18px;
 animation:pulse 3s cubic-bezier(.4,0,.6,1) infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.18;transform:scale(1.035)}}

/* focus mode dims the surveyed ground — three strengths, under test */
#layer.focus .st:not(.current){opacity:.55;filter:saturate(.5)}
#layer.focus .fog{opacity:.6}
#layer.focus #chains{opacity:.72}

/* ---- unsurveyed ground: hachured, torn edge, never nodes ---- */
.fog{position:absolute;cursor:pointer;opacity:0;
 transition-property:opacity,filter;transition-duration:.5s,.25s;
 transition-timing-function:cubic-bezier(.2,0,0,1);
 clip-path:polygon(14% 0,100% 0,100% 100%,9% 100%,0 78%,13% 61%,2% 44%,11% 25%);
 background:
  repeating-linear-gradient(58deg,rgba(109,127,153,.30) 0 1px,transparent 1px 9px),
  linear-gradient(100deg,rgba(109,127,153,.10),rgba(109,127,153,.02))}
.fog.in{opacity:1}
.fog:hover{filter:brightness(1.5)}
.fog .cap{position:absolute;left:50%;top:50%;transform:translate(-46%,-50%);text-align:center;
 white-space:nowrap}
.fog .cap b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.3em;
 text-transform:uppercase;color:#8b9cb6;font-weight:600}
.fog .cap s{display:block;text-decoration:none;font-size:11px;color:#5f708b;margin-top:3px}
.fog.hasnote{background:
  repeating-linear-gradient(58deg,rgba(207,161,75,.34) 0 1px,transparent 1px 9px),
  linear-gradient(100deg,rgba(207,161,75,.10),rgba(207,161,75,.02))}

/* ============ instrument bar ============ */
#bot{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:11px 26px 15px;
 border-top:1px solid rgba(125,145,175,.14)}
.btn{position:relative;background:#101a2c;color:#c8d6e8;border:0;border-radius:9px;padding:9px 14px;
 font-size:13px;cursor:pointer;box-shadow:0 0 0 1px rgba(125,145,175,.18);
 transition-property:background,box-shadow,transform,color;transition-duration:.14s}
.btn:hover{background:#16233a;box-shadow:0 0 0 1px rgba(125,145,175,.36)}
.btn:active{transform:scale(.96)}
.btn.go{background:#f2543d;color:#1a0704;box-shadow:0 0 0 1px #f2543d,0 6px 18px -8px rgba(242,84,61,.6);font-weight:650}
.btn.go:hover{background:#ff6a54}
.btn.on{background:rgba(121,207,192,.14);color:#9fe0d4;box-shadow:0 0 0 1px rgba(121,207,192,.45)}
.btn::after{content:'';position:absolute;inset:-6px}
#copied{font-size:12.5px;color:#79cfc0;opacity:0;transition:opacity .2s}
#copied.on{opacity:1}

/* ============ station sheet ============ */
#veil{position:fixed;inset:0;background:rgba(3,6,12,.6);backdrop-filter:blur(1.5px);
 opacity:0;pointer-events:none;transition:opacity .24s cubic-bezier(.2,0,0,1);z-index:20}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;right:0;top:0;height:100%;width:min(536px,95vw);z-index:21;
 background:linear-gradient(180deg,#111b2e 0,#0d1626 120px,#0a111d);
 box-shadow:-1px 0 0 rgba(196,216,242,.14),-2px 0 0 rgba(0,0,0,.4),
  -46px 0 90px -34px rgba(0,0,0,.95);
 transform:translateX(102%);transition:transform .3s cubic-bezier(.2,0,0,1);
 display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
#sheet.on{transform:none}
/* how far through the sheet you are */
#prog{position:fixed;width:2px;left:0;top:0;background:linear-gradient(180deg,#f2543d,#c23a26);
 border-radius:2px;opacity:0;transition:opacity .25s;z-index:22;pointer-events:none}
#sheet.on ~ #prog,#prog.on{opacity:.85}
#x{position:absolute;top:12px;right:14px;width:40px;height:40px;display:grid;place-items:center;
 background:none;border:0;color:#6d7f99;font-size:17px;cursor:pointer;border-radius:9px;
 /* above the sticky station header, which is also z-index 3 and comes later in the DOM:
    at equal z-index the later element wins, which covered the close button and stole
    its taps — leaving a sliver hittable and no way off the sheet on a touch screen */
 z-index:6;
 transition-property:color,background;transition-duration:.14s}
#x:hover{color:#eef4fb;background:rgba(125,145,175,.12)}
#sh{padding:0 30px 40px;display:flex;flex-direction:column;gap:0}
/* staggered enter */
#sheet.on .sec{animation:rise .42s cubic-bezier(.2,0,0,1) both}
.sec{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* --- where you are: a thumbnail of the traverse, not a text trail --- */
#mini{margin-bottom:0}
#mini .mh{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
#mini .mh b{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.2em;
 text-transform:uppercase;color:#4f6080;font-weight:600}
#mini .mh s{text-decoration:none;font-size:11.5px;color:#6f7f9a}
#minisvg{display:block;width:100%;height:62px;background:rgba(125,145,175,.045);border-radius:9px;
 box-shadow:0 0 0 1px rgba(125,145,175,.10)}
#minisvg rect{fill:#26324a;transition-property:fill;transition-duration:.2s}
#minisvg rect.anc{fill:#5b8ba3}
#minisvg rect.here{fill:#f2543d}
#minisvg rect.fogr{fill:#333d52}
#minisvg path{stroke:rgba(196,216,242,.16);stroke-width:2;fill:none}

#crumb{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;
 color:#4f6080;margin-bottom:11px;line-height:1.7;display:none}
#crumb b{color:#79a0c0;font-weight:500}
#s-eb{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
 font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
#s-eb .tick{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-size:10px}
#s-claim{font-size:23.5px;font-weight:680;line-height:1.24;letter-spacing:-.5px;color:#fff;
 text-wrap:balance}

/* --- the body: every point collapsed to one line, kind-tagged, detail on tap --- */
#bodyhead{display:flex;align-items:center;gap:10px;margin:16px 0 0}
#bodyhead .c{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.2em;
 text-transform:uppercase;color:#54658a;font-weight:600}

.pt{border-top:1px solid rgba(196,216,242,.11)}
.pt:last-of-type{border-bottom:1px solid rgba(196,216,242,.11)}
.pt>summary{display:grid;grid-template-columns:84px 1fr 18px;gap:12px;align-items:start;
 padding:15px 0;cursor:pointer;list-style:none;
 transition-property:opacity;transition-duration:.2s}
.pt>summary::-webkit-details-marker{display:none}
.pt>summary:hover .t{color:#fff}
.pt>summary:hover .chev{color:#cfe0f2}
.kd{font-family:ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;
 font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
 padding:4px 8px 4px 7px;border-radius:99px;background:currentColor;justify-self:start;margin-top:1px}
.kd span{color:#0a1020;mix-blend-mode:normal}
.kd i{width:5px;height:5px;border-radius:99px;background:#0a1020;opacity:.45;flex:0 0 auto}
.k-find{color:#79cfc0}.k-ev{color:#8fb4dd}.k-dec{color:#9be07a}.k-risk{color:#ff7a66}.k-open{color:#c3aee8}
.pt .t{font-size:15px;font-weight:600;color:#c8d6e8;line-height:1.44;text-wrap:pretty;
 transition-property:color;transition-duration:.18s}
.pt .chev{color:#5a6b87;font-size:12px;padding-top:3px;justify-self:end;
 transition-property:transform,color;transition-duration:.2s}
.pt[open] .chev{transform:rotate(90deg);color:#cfe0f2}
.pt[open]>summary .t{color:#fff}
/* when one point is open, the resting ones step back */
#s-body.hasopen .pt:not([open])>summary{opacity:.5}
#s-body.hasopen .pt:not([open])>summary:hover{opacity:1}
.pt .d{font-size:14px;color:#9dadc4;line-height:1.72;padding:0 22px 18px 96px;text-wrap:pretty;
 animation:rise .3s cubic-bezier(.2,0,0,1) both}
.pt .d em{font-style:normal;color:#d6e2f0}
.pt.q .t{color:#cfa14b}

#s-src{margin-top:24px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.75;
 color:#6b7d99;background:rgba(125,145,175,.05);border-radius:10px;padding:12px 14px;
 box-shadow:0 0 0 1px rgba(196,216,242,.10);word-break:break-word}
#s-src .h{display:block;letter-spacing:.2em;text-transform:uppercase;font-size:9px;color:#5b6d89;
 margin-bottom:6px}

/* --- attachments: a prototype built to crack this station --- */
#s-att{margin-top:26px}
#s-att .h{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.22em;
 text-transform:uppercase;color:#7ea2c6;font-weight:700;margin-bottom:11px}
.at{display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border-radius:11px;margin-bottom:8px;
 text-decoration:none;background:rgba(127,168,216,.055);
 box-shadow:0 0 0 1px rgba(127,168,216,.18);
 transition-property:background,box-shadow,transform;transition-duration:.15s}
.at:hover{background:rgba(127,168,216,.12);box-shadow:0 0 0 1px rgba(127,168,216,.42)}
.at:active{transform:scale(.99)}
#decide.plain{background:rgba(125,145,175,.05);box-shadow:0 0 0 1px rgba(196,216,242,.13);margin-top:22px}
#decide.plain #s-note .lb{color:#7e8fac}
.at .ic{font-size:15px;flex:0 0 auto;opacity:.8;line-height:1.35;padding-top:1px}
.at .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.at .b>span{display:block}
.at .b .l{font-size:14px;font-weight:650;color:#e6eef8;line-height:1.35}
.at .b .l em{font-style:normal;font-weight:600;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
 color:#ff9584;background:rgba(242,84,61,.16);border-radius:99px;padding:3px 7px;margin-left:8px;
 vertical-align:2px;white-space:nowrap}
.at .b .c{font-size:12.5px;color:#8697b1;line-height:1.5}
.at .b .pth{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#5c6e8a;line-height:1.5;
 user-select:all;word-break:break-all;padding-top:1px}
.at .go{font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
 color:#8fb4dd;flex:0 0 auto;padding-top:3px}

 background:rgba(127,168,216,.18);color:#8fb4dd;border-radius:99px;padding:2px 6px;margin-left:auto;background:rgba(30,70,110,.16);color:#245b86}


/* the crux's options, as a plotted comparison */
#s-opts{margin-top:26px}
#s-opts .h{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.22em;
 text-transform:uppercase;color:#a67a2f;font-weight:700;margin-bottom:9px}
.op{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:10px;margin-bottom:7px;
 box-shadow:0 0 0 1px rgba(125,145,175,.13)}

.op .b .l{font-size:14px;font-weight:600;color:#dae5f2;line-height:1.4}
.op .b .c{font-size:12.5px;color:#8697b1;line-height:1.6;margin-top:3px}

   first-class target rather than a degraded desktop. Three things have to
   hold at every width: the page never scrolls sideways, every control
   stays reachable, and the detail surface stays readable.
   The picture itself needs no breakpoint — layout() computes it and fit()
   scales it to whatever stage it is given.
   ================================================================== */

<script>
/* ========================= DATA BEGINS =========================
   Replace everything down to DATA ENDS with this session's own ground.
   Worked example below: a small diagnosis, kept short on purpose.
   ================================================================ */

/* What the session is about, shown in the header. */
const TOPIC='Why checkout confirmation emails arrive late';

/* The storage namespace. Set it ONCE per session and never change it again:
   notes are keyed under it, so a new namespace orphans everything the user
   wrote. Refreshing this file with new ground is safe precisely because this
   string stays put. */
const LS='fo-canvas-SESSION-ID:';

/* The stations. ids are stable and declared — notes key off them. Never rename
   a station when its role changes; the shell finds the frontier from state.
   state: settled | open | current | ruled     (exactly one 'current')
   p:     parent ids                            (several = a join)
   pts:   [{t: the claim, one line}, {d: optional detail, hidden until asked}]
   src:   where it came from        att: artifacts built to crack this station,
                                             oldest first (shell shows newest first)
   opts:  the ways out             ask: what you'd do      rd: a one-line ruling
   chip:  render narrow (for a short leaf) */
const N=[
{id:'root',p:[],state:'settled',eb:'root',lbl:'Do we need to touch the mailer at all?',
 pts:[{t:'It arrived solution-shaped, so it became one candidate among others.',
       d:'The ask was "add a second mail provider". That presumes the provider is the problem, which nothing had established yet.'},
      {t:'Answer: yes, something needs changing — but not the provider.',
       d:'Confirmed once the delay was located on our side of the handoff.'}]},

{id:'what',p:['root'],state:'settled',eb:'the real root',lbl:'What exactly is late?',
 pts:[{t:'Checkout confirmations, and only at peak.',
       d:'Off-peak they land in under four seconds. Between 18:00 and 21:00 the tail reaches nine minutes.'},
      {t:'Password resets on the same provider are unaffected.',
       d:'Same credentials, same region, same template engine — which is what first pointed away from the provider.'}],
 src:'dashboard: mail.send.latency p99, last 14 days'},

{id:'queue',p:['what'],state:'settled',eb:'surveyed',lbl:'The delay is in our queue, not the provider',
 pts:[{t:'Provider-side send time is flat all day.',
       d:'Their own trace shows accept-to-delivered under two seconds at every hour we sampled.'},
      {t:'Time is spent waiting to be picked up.',
       d:'Enqueue-to-dequeue is the whole gap. The send itself never got slower.'}],
 src:'provider trace + queue depth metric'},

{id:'retry',p:['queue'],state:'settled',eb:'surveyed',lbl:'Retries crowd out first attempts',
 pts:[{t:'One consumer, one FIFO queue, retries at the back.',
       d:'A retry costs as much as a fresh send, so a burst of failures pushes every new message behind the backlog.'},
      {t:'Peak failure rate is only 3% — but retries are unbounded.',
       d:'Six attempts per failure at peak volume is enough to double the queue on its own.'}],
 src:'worker config: maxAttempts unset'},

{id:'retry-policy',p:['retry'],state:'current',eb:'where we are now',lbl:'Cap the retries, or give them their own lane?',
 pts:[{t:'Both fix the crowding; they differ in what they give up.',
       d:'Capping drops some genuinely recoverable sends. A separate lane keeps them but adds a queue to run.'},
      {t:'Nothing here needs the provider change the ask started with.',
       d:'Worth saying plainly, because that work is already scheduled.'}],
 opts:[{l:'Cap attempts at two',c:'One config line. Sheds the tail immediately; loses sends that a third try would have saved.',w:1},
       {l:'Separate retry lane',c:'Retries move to their own consumer. Keeps every send, adds a queue to operate and watch.',w:3,pick:1},
       {l:'Both, in that order',c:'Cap now to stop the bleeding, build the lane next sprint.',w:2}],
 ask:'The separate lane — the cap trades away real deliveries to fix an operational problem, and that trade outlives the incident.',
 att:[{l:'Queue-depth replay',c:'peak traffic against both options',h:'file:///tmp/example-replay.html',cur:1}],
 rq:'Open it, then say what you think in the note below. Your reaction is what turns this into a criterion — and because it lands here, it travels back attached to the question it answers.'},

{id:'o1',p:['retry-policy'],state:'open',eb:'open',lbl:'What does a cap cost in real deliveries?',
 pts:[{t:'Unmeasured. Needs the share of sends that succeed on attempt three or later.',
       d:'The number decides whether capping is cheap or quietly lossy, so it gates the choice above rather than following it.'}]},

{id:'o2',p:['retry-policy'],state:'open',eb:'open',lbl:'Does a second lane need a migration window?',
 pts:[{t:'Probably not, but the in-flight backlog has to drain somewhere.',d:'Unresolved.'}]},

{id:'ruled',p:['what'],state:'ruled',eb:'off the sheet',lbl:'Switch email providers',
 rd:'ruled out — the provider was never slow',
 pts:[{t:'Kept only so it does not get re-opened.',
       d:'The evidence that closed it is on the station above: provider-side send time is flat at every hour sampled.'}]}
];

/* Which kind each point is, keyed 'stationId:pointIndex'. Out here rather than
   inline so the point rows stay readable.
   One of: find | ev | dec | risk | open  (labels live in KN, in the shell). */
const KIND={
'root:0':'find','root:1':'dec',
'what:0':'ev','what:1':'ev',
'queue:0':'ev','queue:1':'find',
'retry:0':'find','retry:1':'ev',
'retry-policy:0':'find','retry-policy:1':'dec',
'o1:0':'open','o2:0':'open',
'ruled:0':'dec',
'fog:0':'risk','fog:1':'open'};

/* Artifacts the whole session produced — they belong to no single station, so
   they hang off the header chip rather than cluttering the sheet. */
const SESSION={id:'session',eb:'session artifacts',lbl:'What this session has produced',
 pts:[{t:'One replay harness, built to price the two ways out.',
       d:'Disposable. It exists to settle the crux, not to ship.'},
      {t:'One investigation log, appended every meaningful turn.',
       d:'The chronological line of reasoning — belief, evidence, findings, open threads, rulings. Survives context loss; this canvas renders its current state.'}],
 att:[{l:'Queue-depth replay',c:'peak traffic against both options',h:'file:///tmp/example-replay.html',cur:1},
      {l:'Investigation log',c:'append-only, every meaningful turn',h:'file:///tmp/example-figure-out-log.md'}]};

/* The unsurveyed patch. Territory, never nodes: one region with an extent,
   not a list of sub-questions. Its id is the patch's stable identity, not the
   generic word "fog". If this patch sharpens into a station, carry the id onto
   that station and give any remaining fog a new id, so each note keeps its home. */
const FOG={id:'shared-queue-fog',eb:'fog',lbl:'What else rides on this queue?',cap:'1 patch',
 pts:[{t:'Other producers share the consumer, and we have not looked at them.',
       d:'If any of them is also retrying unbounded, the fix above treats a symptom of something wider.'},
      {t:'Not yet a question — we do not know what else publishes here.',
       d:'Deliberately left as one patch rather than split into guesses.'}],
 src:'Deliberately not sliced into sub-questions — one patch, not yet a question.'};

/* ========================== DATA ENDS ========================== */

/* --- interaction shell from here down: preserve unless the session genuinely
       needs a different picture, judged against the canvas contract. --- */
const T={settled:'\u2713',open:'?',current:'\u25c9',ruled:'\u2715'};
const KN={find:'finding',ev:'evidence',dec:'decided',risk:'weak spot',open:'still open'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ================= build ================= */
const stage=document.getElementById('stage'),layer=document.getElementById('layer'),svg=document.getElementById('chains');
const byId={};N.forEach(n=>byId[n.id]=n);
// Identity never changes when the frontier moves; topology and state supply roles.
const rootStation=N.find(n=>!n.p.length),frontier=N.find(n=>n.state==='current');
N.forEach(n=>{
 const d=document.createElement('div');
 d.className='st '+n.state; d.tabIndex=0; d.dataset.id=n.id;
 d.style.width=(n.state==='current'?252:n.chip?178:216)+'px';
 d.innerHTML='<div class="plate"><div class="eb"><span class="tick">'+(T[n.state]||'')+'</span>'+esc(n.eb)+
  (n.att&&n.att.length?'<span class="clip">proto</span>':'')+'</div>'+
  '<div class="lbl">'+esc(n.lbl)+'</div>'+(n.rd?'<div class="rd">\u2937 '+esc(n.rd)+'</div>':'')+
  '<span class="note"></span></div>'+
  (n.state==='current'?'<div class="halo"></div><div class="cross"><i></i><i></i><i></i><i></i><u></u><u></u><u></u><u></u></div>':'');
 d.onclick=()=>{if(!dragged)openNode(n.id);};
 d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNode(n.id);}};
 layer.appendChild(d); n.el=d;
});
const fogEl=document.createElement('div');
fogEl.className='fog'; fogEl.tabIndex=0;
fogEl.innerHTML='<div class="cap"><b>unsurveyed</b><s>'+esc(FOG.cap||'')+'</s></div>';
fogEl.onclick=()=>{if(!dragged)openNode('fog');};
fogEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNode('fog');}};
layer.appendChild(fogEl);

/* ================= layered layout ================= */
const COLGAP=80,ROWGAP=24,FOGW=190,FOGH=210;
let box={W:1,H:1};
function layout(){
 const dep={};N.forEach(n=>dep[n.id]=0);
 // A DAG's longest path is shorter than its node count. Using that natural bound
 // keeps the result independent of data order without imposing an arbitrary depth cap.
 for(let k=0,ch=1;ch&&k<N.length;k++){ch=0;
  N.forEach(n=>n.p.forEach(pi=>{if(dep[pi]+1>dep[n.id]){dep[n.id]=dep[pi]+1;ch=1;}}));}
 const cols=[];N.forEach(n=>{(cols[dep[n.id]]=cols[dep[n.id]]||[]).push(n);});
 N.forEach(n=>{n.w=n.el.offsetWidth;n.h=n.el.offsetHeight;});

 let x=0;const colX=[];
 cols.forEach((c,i)=>{colX[i]=x;x+=Math.max.apply(null,c.map(n=>n.w))+COLGAP;});
 const fogX=x;

 cols.forEach((c,i)=>{
  c.forEach(n=>{n.want=n.p.length?n.p.reduce((s,pi)=>s+byId[pi].cy,0)/n.p.length:0;});
  if(i===0){let t=0;c.forEach(n=>{n.y=t;t+=n.h+ROWGAP;});}
  else{
   c.sort((a,b)=>a.want-b.want||N.indexOf(a)-N.indexOf(b));
   let t=-1e9;
   c.forEach(n=>{let y=n.want-n.h/2;if(y<t)y=t;n.y=y;t=y+n.h+ROWGAP;});
   const drift=c.reduce((s,n)=>s+(n.y+n.h/2-n.want),0)/c.length;
   if(drift>0)c.forEach(n=>n.y-=drift);
  }
  c.forEach(n=>{n.x=colX[i];n.cy=n.y+n.h/2;});
  c.forEach((n,j)=>{n.col=i;n.row=j;});
 });

 const cx=frontier, fy=cx.cy-FOGH/2;
 let minY=Math.min.apply(null,N.map(n=>n.y).concat([fy]))-24;
 let maxY=Math.max.apply(null,N.map(n=>n.y+n.h).concat([fy+FOGH]))+24;
 N.forEach(n=>{n.y-=minY;n.cy-=minY;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';});
 Object.assign(fogEl.style,{width:FOGW+'px',height:FOGH+'px',left:fogX+'px',top:(fy-minY)+'px'});

 const W=fogX+FOGW,H=maxY-minY;
 svg.setAttribute('width',W);svg.setAttribute('height',H);svg.innerHTML='';
 const chain=(a,b,cls,extra)=>{
  const x1=a.x+a.w,y1=a.cy,x2=b.x,y2=b.cy,mx=(x1+x2)/2;
  const d='M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2;
  [cls].concat(extra||[]).forEach(c=>{
   const p=document.createElementNS('http://www.w3.org/2000/svg','path');
   p.setAttribute('d',d);p.setAttribute('class',c);svg.appendChild(p);});
 };
 N.forEach(n=>n.p.forEach(pi=>{
  const cls=n.state==='current'?'ch-live':n.state==='open'?'ch-open':n.state==='ruled'?'ch-dead':'ch-done';
  chain(byId[pi],n,cls,n.state==='current'?['flow']:null);}));
 chain(cx,{x:fogX,w:0,cy:fy-minY+FOGH/2},'ch-fog');
 return {W:W,H:H};
}

/* ================= fit, pan, zoom ================= */
let sc=1,tx=0,ty=0;
const apply=()=>layer.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
function fit(){const pad=58,r=stage.getBoundingClientRect();
 sc=Math.min((r.width-pad*2)/box.W,(r.height-pad*2)/box.H,1.3);
 tx=(r.width-box.W*sc)/2;ty=(r.height-box.H*sc)/2;apply();}
function center(n,zoom){const r=stage.getBoundingClientRect();
 if(zoom)sc=Math.min(1.5,Math.max(sc,.95));
 tx=r.width/2-(n.x+n.w/2)*sc; ty=r.height/2-n.cy*sc; apply();}
let down=null,dragged=false;
stage.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,tx:tx,ty:ty};dragged=false;stage.classList.add('drag');});
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;
 if(Math.abs(dx)+Math.abs(dy)>4)dragged=true;tx=down.tx+dx;ty=down.ty+dy;apply();});
addEventListener('pointerup',()=>{down=null;stage.classList.remove('drag');setTimeout(()=>{dragged=false;},0);});
stage.addEventListener('wheel',e=>{e.preventDefault();
 const r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 const ns=Math.min(2.4,Math.max(.28,sc*Math.exp(-e.deltaY*0.0016)));
 tx=mx-(mx-tx)*(ns/sc);ty=my-(my-ty)*(ns/sc);sc=ns;apply();},{passive:false});
document.getElementById('fit').onclick=fit;
addEventListener('resize',()=>{focusOn?center(frontier,1):fit();});

const focusBtn=document.getElementById('focus');
let focusOn=false;
function setFocus(on){focusOn=on;layer.classList.toggle('focus',on);
 focusBtn.classList.toggle('on',on);
 focusBtn.textContent=on?'Show the whole sheet':'Focus the crux';
 if(on)center(frontier,1);else fit();}
focusBtn.onclick=()=>setFocus(!focusOn);

/* ================= notes ================= */
/* Storage can fail two different ways for a file:// document: denied outright, or
   readable but refusing writes (quota). A canvas that cannot remember notes is still
   worth reading, so degrade to a session without persistence rather than taking the
   sheet down — and read the in-memory copy FIRST, so a note whose write was refused
   still reaches the note markers and the outgoing bundle instead of being read back
   stale from storage. */
let noteFallback={},storageDegraded=false,reloadArmed=false;
// "fog" is the sheet's routing name; storage follows the current patch's own id.
const noteId=id=>id==='fog'?FOG.id:id;
const note=id=>{
 const k=LS+noteId(id);
 if(Object.prototype.hasOwnProperty.call(noteFallback,k))return noteFallback[k];
 try{return localStorage.getItem(k)||'';}catch(e){storageDegraded=true;return '';}
};
const putNote=(id,v)=>{
 const k=LS+noteId(id);
 noteFallback[k]=v;                     // authoritative for this page's lifetime
 try{localStorage.setItem(k,v);}catch(e){storageDegraded=true;}
 return !storageDegraded;
};
const mark=id=>{const el=id==='fog'?fogEl:(byId[id]||{}).el;if(el)el.classList.toggle('hasnote',!!note(id).trim());};

/* ================= station sheet ================= */
const veil=document.getElementById('veil'),sheet=document.getElementById('sheet'),ta=document.getElementById('ta');
const EBC={settled:'#5f9d92',rule:'#5f9d92',surveyed:'#5f9d92',open:'#b08c3f','off the sheet':'#546581',
 'where we are now':'#f2543d',fog:'#8b9cb6',root:'#5f9d92','the real root':'#5f9d92'};
let cur=null,tmr=null;
function openNode(id){
 const n=id==='fog'?FOG:id==='session'?SESSION:byId[id];if(!n)return;cur=id;
 // breadcrumb: the chain of parents that led here
 const trail=[];let q=n.p?n.p.slice(0,1):[];
 while(q.length){const a=byId[q[0]];if(!a)break;trail.unshift(a.lbl);q=a.p.slice(0,1);}
 document.getElementById('crumb').innerHTML=id==='fog'
  ? 'beyond the frontier'
  : (trail.length?trail.map(t=>'<b>'+esc(t)+'</b>').join(' \u2192 ')+' \u2192 here':'origin of the traverse');
 const eb=document.getElementById('s-eb');
 eb.innerHTML='<span class="tick" style="background:rgba(125,145,175,.12)">'+(T[n.state]||'\u25cc')+'</span>'+esc(n.eb);
 eb.style.color=EBC[n.eb]||'#8b9cb6';
 document.getElementById('s-claim').textContent=n.lbl;
 const pts=n.pts||[];
 document.getElementById('s-body').innerHTML=pts.map((p,i)=>{
  const k=KIND[id+':'+i]||'find';
  // every detail waits behind an explicit action — including on a one-point station
  return '<details class="pt"><summary>'+
   '<span class="kd k-'+k+'"><i></i><span>'+KN[k]+'</span></span>'+
   '<span class="t">'+esc(p.t)+'</span>'+
   '<span class="chev">'+(p.d?'\u276f':'')+'</span></summary>'+
   (p.d?'<div class="d">'+esc(p.d)+'</div>':'')+'</details>';}).join('');
 wireAccordion();
 document.getElementById('ptcount').textContent=pts.length+(pts.length===1?' point':' points');
 drawMini(id==='session'?rootStation.id:id);
 const at=document.getElementById('s-att'),rawAtt=n.att||[];
 // Station prototypes are authored chronologically and shown newest-first. Session
 // artifacts keep their authored order because they are different kinds, not revisions.
 const atts=id==='session'?rawAtt:rawAtt.slice().reverse();
 at.innerHTML=atts.length?'<div class="h">built to crack this — '+atts.length+'</div>'+atts.map(v=>
  '<a class="at'+(v.cur?' cur':'')+'" href="'+esc(v.h).replace(/"/g,'&quot;')+'"><span class="ic">◱</span><span class="b">'+
  '<span class="l">'+esc(v.l)+(v.cur?'<em>you are in it</em>':'')+'</span><span class="c">'+esc(v.c)+'</span>'+
  '<span class="pth">'+esc(v.h.replace('file://',''))+'</span></span>'+
  '<span class="go">open ↗</span></a>').join('')+
  (n.rq?'<div class="rq">'+esc(n.rq)+'</div>':''):'';
 at.style.display=atts.length?'':'none';
 const o=document.getElementById('s-opts'),opts=n.opts||[];
 o.innerHTML=opts.length?'<div class="h">ways out</div>'+opts.map((v,i)=>
  '<div class="op'+(v.pick?' pick':'')+'"><div class="n">'+(i+1)+'</div><div class="b"><div class="l">'+
  esc(v.l)+'</div><div class="c">'+esc(v.c)+'</div></div>'+
  '<div class="eff"><div class="w">'+[1,2,3].map(j=>'<i'+(j<=(v.w||0)?' class="on"':'')+'></i>').join('')+
  '</div><div class="e">effort</div></div></div>').join(''):'';
 o.style.display=opts.length?'':'none';
 const ask=document.getElementById('s-ask');
 ask.innerHTML=n.ask?'<span class="h">what I\u2019d do</span>'+esc(n.ask):'';ask.style.display=n.ask?'':'none';
 document.getElementById('decide').classList.toggle('plain',!n.ask);
 document.getElementById('notelb').textContent=n.ask?'your call':'your note';
 const src=document.getElementById('s-src');
 src.innerHTML=n.src?'<span class="h">where this comes from</span>'+esc(n.src):'';src.style.display=n.src?'':'none';
 ta.value=note(id);
 const saved=document.getElementById('saved');
 saved.textContent=storageDegraded?'page only — copy before reload':'saved';
 saved.classList.toggle('warn',storageDegraded);saved.classList.toggle('on',storageDegraded);
 // restart the staggered enter
 const secs=sheet.querySelectorAll('.sec');
 secs.forEach((s,i)=>{s.style.animation='none';void s.offsetWidth;
  s.style.animation='';s.style.animationDelay=(i*52)+'ms';});
 veil.classList.add('on');sheet.classList.add('on');
 sheet.scrollTop=0;prog.classList.remove('on');
 // rows arrive in rhythm rather than all at once
 [].forEach.call(sheet.querySelectorAll('#s-body .pt, #s-att .at, #s-opts .op'),(r,i)=>{
  r.style.animation='none';void r.offsetWidth;
  r.style.animation='rise .34s cubic-bezier(.2,0,0,1) both';
  r.style.animationDelay=(150+Math.min(i,7)*42)+'ms';});
 if(byId[id])center(byId[id]);
}

/* one detail open at a time, and the resting ones step back */
const sbody=()=>document.getElementById('s-body');
function syncOpen(){sbody().classList.toggle('hasopen',!!sbody().querySelector('details.pt[open]'));}
function wireAccordion(){
 [].forEach.call(sbody().querySelectorAll('details.pt'),d=>{
  d.addEventListener('toggle',()=>{
   if(d.open)
    [].forEach.call(sbody().querySelectorAll('details.pt'),o=>{if(o!==d)o.open=false;});
   syncOpen();});});
 syncOpen();
}

/* how far through the sheet you are */
const prog=document.getElementById('prog');
sheet.addEventListener('scroll',()=>{
 const h=sheet.scrollHeight-sheet.clientHeight;
 if(h<12){prog.classList.remove('on');return;}
 prog.classList.add('on');
 prog.style.left=sheet.getBoundingClientRect().left+'px';
 prog.style.height=Math.max(24,sheet.clientHeight*(sheet.clientHeight/sheet.scrollHeight))+'px';
 prog.style.top=(sheet.scrollTop/h)*(sheet.clientHeight-parseFloat(prog.style.height))+'px';
});

/* thumbnail of the traverse, with this station lit and its line of descent traced */
const msvg=document.getElementById('minisvg');
function drawMini(id){
 msvg.setAttribute('viewBox','0 0 '+box.W+' '+box.H);
 const anc={};let q=id==='fog'?[frontier.id]:(byId[id]||{p:[]}).p.slice();
 while(q.length){const a=q.pop();if(!a||anc[a])continue;anc[a]=1;(byId[a]||{p:[]}).p.forEach(x=>q.push(x));}
 let s='';
 N.forEach(n=>n.p.forEach(pi=>{const a=byId[pi];
  s+='<path d="M'+(a.x+a.w)+','+a.cy+' L'+n.x+','+n.cy+'"/>';}));
 N.forEach(n=>{const c=n.id===id?'here':anc[n.id]?'anc':'';
  s+='<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="7" class="'+c+'"/>';});
 const fr=fogEl.getBoundingClientRect;
 s+='<rect x="'+(box.W-190)+'" y="'+(frontier.cy-105)+'" width="190" height="210" rx="18" class="'+
  (id==='fog'?'here':'fogr')+'"/>';
 msvg.innerHTML=s;
 const tot=Math.max.apply(null,N.map(n=>n.col))+1;
 document.getElementById('minicap').textContent=id==='fog'
  ? 'beyond the frontier' : 'column '+((byId[id]||{}).col+1)+' of '+tot;
}
function close(){veil.classList.remove('on');sheet.classList.remove('on');cur=null;}
document.getElementById('x').onclick=close;veil.onclick=close;
ta.addEventListener('input',()=>{if(!cur)return;
 reloadArmed=false;
 const persisted=putNote(cur,ta.value);mark(cur);markSession();
 const s=document.getElementById('saved');
 s.textContent=persisted?'saved':'page only — copy before reload';
 s.classList.toggle('warn',!persisted);s.classList.add('on');clearTimeout(tmr);
 if(persisted)tmr=setTimeout(()=>s.classList.remove('on'),1500);});

const walk=N.map(n=>n.id).concat('fog');
addEventListener('keydown',e=>{
 if(e.key==='Escape')return document.getElementById('out').classList.contains('on')?outClose():close();
 if(e.target.tagName==='TEXTAREA')return;
 if(e.key==='r'||e.key==='R')return reloadCanvas();
 if(e.key==='f'||e.key==='F')return focusBtn.click();
 if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
  let i=cur?walk.indexOf(cur):walk.indexOf(frontier.id);
  // the session panel is not a station on the traverse; walk resumes from the frontier
  if(i<0){openNode(frontier.id);e.preventDefault();return;}
  openNode(walk[cur?(i+(e.key==='ArrowRight'?1:-1)+walk.length)%walk.length:i]);e.preventDefault();}
});

/* ================= bundle ================= */
function bundle(){
 const L=['My notes from the canvas:',''];
 N.concat([{id:'fog',lbl:FOG.lbl,state:'fog'},
           {id:'session',lbl:SESSION.lbl,state:'session'}]).forEach(n=>{
  const v=note(n.id).trim();if(!v)return;
  L.push('\u2014 '+n.lbl+(n.state==='current'?'   [the current crux]':n.state==='fog'?'   [fog]'
         :n.state==='session'?'   [session artifacts]':''));
  L.push('  '+v.replace(/\n/g,'\n  '));L.push('');});
 if(L.length===2)L.push('(nothing yet)');
 return L.join('\n');
}
const out=document.getElementById('out');
const outClose=()=>out.classList.remove('on');
const showBundle=label=>{out.querySelector('.lb').textContent=label||'paste this into chat';
 document.getElementById('outpre').textContent=bundle();out.classList.add('on');};
const hasNotes=()=>N.some(n=>note(n.id).trim())||note('fog').trim()||note('session').trim();
// R can prevent an unsafe reload inside the page; guard browser-native reload too.
addEventListener('beforeunload',e=>{
 if(storageDegraded&&hasNotes()&&!reloadArmed){e.preventDefault();e.returnValue='';}
});
function reloadCanvas(){
 if(storageDegraded&&hasNotes()&&!reloadArmed){showBundle('copy these page-only notes before reloading');return;}
 location.reload();
}
document.getElementById('show').onclick=()=>showBundle();
document.getElementById('outclose').onclick=outClose;
function doCopy(){
 const t=bundle(),c=document.getElementById('copied');
 const ok=()=>{c.classList.add('on');setTimeout(()=>c.classList.remove('on'),1700);
  if(storageDegraded){reloadArmed=true;out.querySelector('.lb').textContent='notes copied — press R to reload';}};
 const fb=()=>{showBundle(storageDegraded?'copy these page-only notes, then use browser reload':'paste this into chat');
  const p=document.getElementById('outpre'),r=document.createRange();r.selectNodeContents(p);
  const s=getSelection();s.removeAllRanges();s.addRange(r);};
 navigator.clipboard?navigator.clipboard.writeText(t).then(ok,fb):fb();
}
document.getElementById('copy').onclick=doCopy;document.getElementById('copy2').onclick=doCopy;

/* ================= plot the sheet: staggered, column by column ================= */
N.concat([{id:'fog'}]).forEach(n=>mark(n.id));
/* the session panel has no plate to carry a dot, so the header chip carries it —
   otherwise a note left there is invisible until the bundle is opened */
const artchip=document.getElementById('artchip'),sessionAtt=SESSION.att||[],sessionPts=SESSION.pts||[];
const markSession=()=>{
 const hasNote=!!note('session').trim(),hasGround=!!(sessionAtt.length||sessionPts.length);
 artchip.classList.toggle('hasnote',hasNote);artchip.hidden=!(hasGround||hasNote);
 artchip.textContent=sessionAtt.length
  ? sessionAtt.length+' artifact'+(sessionAtt.length===1?'':'s')
  : 'session note';
};
markSession();
document.getElementById('title').textContent=TOPIC;
artchip.onclick=()=>openNode('session');
box=layout();fit();
function settle(){[].forEach.call(svg.querySelectorAll('path'),p=>{
 p.style.transition='';p.style.strokeDasharray='';p.style.strokeDashoffset='';});
 N.forEach(n=>n.el.classList.add('in'));fogEl.classList.add('in');}

const paths=[].slice.call(svg.querySelectorAll('path'));
paths.forEach(p=>{const L=p.getTotalLength();
 p.style.strokeDasharray=p.getAttribute('class')==='flow'?'':L;
 if(p.getAttribute('class')!=='flow'){p.style.strokeDashoffset=L;
  p.style.transition='stroke-dashoffset .9s cubic-bezier(.2,0,0,1)';}});
requestAnimationFrame(()=>{
 paths.forEach(p=>{if(p.getAttribute('class')!=='flow')p.style.strokeDashoffset=0;});
 N.forEach(n=>setTimeout(()=>n.el.classList.add('in'),120+n.col*74+n.row*22));
 setTimeout(()=>fogEl.classList.add('in'),120+(Math.max.apply(null,N.map(n=>n.col))+1)*74);
 // land on the crux, focused, once the sheet has plotted
 setTimeout(()=>setFocus(true),1250);
 // restore the survey dash pattern once the lines have drawn
 setTimeout(()=>paths.forEach(p=>{p.style.transition='';p.style.strokeDasharray='';p.style.strokeDashoffset='';}),1150);
});
</script></body></html>
