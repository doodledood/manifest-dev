<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>Orchestrate status</title>
<!--
  orchestrate's status page. This file is a fixed template: the orchestrator copies it unchanged and,
  at each check-in, rewrites only the JSON inside <script id="orchestrate-status"> below. Every field
  the page reads, and where the page is published, is documented in references/STATUS_PAGE.md.
  The page loads nothing from the network: no fonts, styles or scripts. It links only to http(s).
-->
<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --shade: rgba(0, 0, 0, .05);
  --fill: rgba(118, 118, 128, .12);
  --text: #1d1d1f;
  --text-2: rgba(60, 60, 67, .76);
  --text-3: rgba(60, 60, 67, .36);
  --sep: rgba(60, 60, 67, .18);
  --edge: rgba(60, 60, 67, .4);
  --dot: rgba(60, 60, 67, .16);
  --blue: #0066d6;
  --green: #1f7a36;
  --orange: #c93400;
  --red: #c4001a;
  --blue-fill: #007aff;
  --green-fill: #34c759;
  --orange-fill: #ff9500;
  --red-fill: #ff3b30;
  --on-orange: #1d1d1f;
  --solid-red: #d70015;
  --blue-tint: rgba(0, 122, 255, .10);
  --orange-tint: rgba(255, 149, 0, .14);
  --red-tint: rgba(255, 59, 48, .11);
  --material: rgba(255, 255, 255, .8);
  --sheet-material: rgba(250, 250, 252, .9);
  --float: 0 0 0 .5px rgba(0, 0, 0, .06), 0 6px 24px rgba(0, 0, 0, .08);
  --lift: 0 0 0 .5px rgba(0, 0, 0, .06), 0 16px 48px rgba(0, 0, 0, .16);
  --scrim: rgba(0, 0, 0, .2);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --card: #1c1c1e;
    --shade: transparent;
    --fill: rgba(118, 118, 128, .26);
    --text: #f5f5f7;
    --text-2: rgba(235, 235, 245, .66);
    --text-3: rgba(235, 235, 245, .32);
    --sep: rgba(84, 84, 88, .6);
    --edge: rgba(235, 235, 245, .34);
    --dot: rgba(235, 235, 245, .12);
    --blue: #409cff;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff6961;
    --blue-fill: #0a84ff;
    --green-fill: #30d158;
    --orange-fill: #ff9f0a;
    --red-fill: #ff453a;
    --on-orange: #000000;
    --solid-red: #d70015;
    --blue-tint: rgba(10, 132, 255, .2);
    --orange-tint: rgba(255, 159, 10, .18);
    --red-tint: rgba(255, 69, 58, .18);
    --material: rgba(36, 36, 38, .8);
    --sheet-material: rgba(30, 30, 32, .92);
    --float: 0 0 0 .5px rgba(255, 255, 255, .08), 0 6px 24px rgba(0, 0, 0, .5);
    --lift: 0 0 0 .5px rgba(255, 255, 255, .08), 0 16px 48px rgba(0, 0, 0, .7);
    --scrim: rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --card: #1c1c1e;
  --shade: transparent;
  --fill: rgba(118, 118, 128, .26);
  --text: #f5f5f7;
  --text-2: rgba(235, 235, 245, .66);
  --text-3: rgba(235, 235, 245, .32);
  --sep: rgba(84, 84, 88, .6);
  --edge: rgba(235, 235, 245, .34);
  --dot: rgba(235, 235, 245, .12);
  --blue: #409cff;
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff6961;
  --blue-fill: #0a84ff;
  --green-fill: #30d158;
  --orange-fill: #ff9f0a;
  --red-fill: #ff453a;
  --on-orange: #000000;
  --solid-red: #d70015;
  --blue-tint: rgba(10, 132, 255, .2);
  --orange-tint: rgba(255, 159, 10, .18);
  --red-tint: rgba(255, 69, 58, .18);
  --material: rgba(36, 36, 38, .8);
  --sheet-material: rgba(30, 30, 32, .92);
  --float: 0 0 0 .5px rgba(255, 255, 255, .08), 0 6px 24px rgba(0, 0, 0, .5);
  --lift: 0 0 0 .5px rgba(255, 255, 255, .08), 0 16px 48px rgba(0, 0, 0, .7);
  --scrim: rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--blue-fill); outline-offset: 2px; }
.sheet .dismiss:focus-visible { outline-offset: -2px; }
.sheet:focus, .sheet:focus-visible { outline: none; } /* the sheet takes focus only to hold it inside; its controls show their own ring */
code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

/* ---------- The graph owns the whole viewport ---------- */
.stage { position: fixed; inset: 0; height: 100dvh; }
.board { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
.board.dragging { cursor: grabbing; }
.board text { fill: var(--tx, var(--text)); }
.board .node { cursor: pointer; outline: none; }
.board .node.deco { cursor: inherit; }
.board .press { transform-box: fill-box; transform-origin: center; transition: transform 160ms var(--ease-out); }
.board .node.pressed .press { transform: scale(.97); }
.board .el { fill: var(--text-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.board .pulse { fill: none; stroke: var(--c); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.board .fillp { fill: none; stroke-dasharray: 1 1; }

.tone-run  { --c: var(--blue-fill);   --ct: var(--blue); }
.tone-done { --c: var(--green-fill);  --ct: var(--green); }
.tone-you  { --c: var(--orange-fill); --ct: var(--orange); }
.tone-stop { --c: var(--red-fill);    --ct: var(--red); }
.tone-wait { --c: var(--text-3);      --ct: var(--text-2); }
.tone-idle { --c: var(--text-3);      --ct: var(--text-2); }
.tone-prop { --c: var(--blue-fill);   --ct: var(--blue); }

.t-id { font-size: 11px; fill: var(--tx, var(--text-2)) !important; font-variant-numeric: tabular-nums; }
.t-kind { fill: var(--tx, var(--text-2)) !important; font-weight: 500; }
.t-title { font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
.t-status { font-size: 11px; font-weight: 600; fill: var(--tx, var(--ct)) !important; }
.t-col { font-size: 12px; font-weight: 600; fill: var(--text-2) !important; letter-spacing: .01em; }
.dot { fill: var(--tx, var(--c)); }
.tone-wait .dot, .tone-idle .dot { fill: none; stroke: var(--c); stroke-width: 1.5; }
.badge circle { fill: var(--tx, var(--orange-fill)); }
.badge text { fill: var(--badge-tx, var(--on-orange)) !important; font-size: 11px; font-weight: 700; text-anchor: middle; font-variant-numeric: tabular-nums; }
.badge.tone-stop circle { fill: var(--tx, var(--solid-red)); }
.badge.tone-stop text { fill: var(--badge-tx, #fff) !important; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; stroke-opacity: .5; }
.edge.k-after { stroke-dasharray: 5 4; }
.edge.k-from { stroke-dasharray: .5 4.5; stroke-linecap: round; stroke-width: 2; }
.edge.k-goal { stroke-opacity: .18; }
.edge.hi { stroke: var(--blue-fill); stroke-width: 2; stroke-opacity: 1; opacity: 1 !important; }

.sh { fill: var(--shade); }
.box { fill: var(--card); stroke: var(--sep); stroke-width: 1; }
/* Attention, ranked for the person checking in: a stuck card is solid red, one that waits on the person
   solid orange; a running card stays calm, its colour only in its dot and bar; waiting and landed cards
   recede; the goal is a quiet card. A solid card sets --tx for everything drawn on it. */
.tone-you .box { fill: var(--orange-fill); stroke: none; }
.tone-stop .box { fill: var(--solid-red); stroke: none; }
.node.n-you { --tx: var(--on-orange); --badge-tx: var(--orange-fill); --bar-bg: rgba(0, 0, 0, .16); }
.node.n-stop { --tx: #fff; --badge-tx: var(--solid-red); --bar-bg: rgba(255, 255, 255, .25); }
.node.n-you .t-title, .node.n-stop .t-title { font-weight: 700; }
.node.n-you .press { filter: drop-shadow(0 6px 16px rgba(255, 149, 0, .32)); }
.node.n-stop .press { filter: drop-shadow(0 6px 18px rgba(255, 59, 48, .4)); }
.node.n-run .t-title { font-weight: 500; }
/* Waiting and landed cards recede through their surface and marks; their text keeps full contrast. */
.node.n-done .box, .node.n-idle .box, .node.n-wait .box { stroke-opacity: .5; }
.node.n-done .dot, .node.n-done .bar, .node.n-done .bar-bg, .node.n-idle .dot, .node.n-wait .dot { opacity: .5; }
.node.n-wait .t-title { fill: var(--text-2); font-weight: 500; }
.node.n-done .t-status, .node.n-idle .t-status, .node.n-wait .t-status { fill: var(--text-2) !important; font-weight: 500; }
.tone-done .box { fill: transparent; }
.tone-done .t-title, .tone-idle .t-title { fill: var(--text-2); font-weight: 500; }
.tone-idle .box, .tone-prop .box { fill: transparent; stroke-dasharray: 4 3; stroke: var(--edge); }
.tone-prop .box { stroke: var(--c); stroke-width: 1.5; }
.bar-bg { fill: none; stroke: var(--bar-bg, var(--fill)); stroke-width: 4; stroke-linecap: round; }
.bar { stroke: var(--tx, var(--c)); stroke-width: 4; stroke-linecap: round; }
.goal rect { fill: var(--card); stroke: var(--sep); stroke-width: 1; }
.goal .g-k { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--text-2); }
.goal .g-t { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.goal .g-d { font-size: 12px; fill: var(--text-2); }
.node.sel .box, .node:focus-visible .box { stroke: var(--blue-fill); stroke-width: 2.25; stroke-dasharray: none; }
.node.n-you.sel .box, .node.n-stop.sel .box, .node.n-you:focus-visible .box, .node.n-stop:focus-visible .box { stroke: var(--text); stroke-width: 2.5; }

/* ---------- Floating chrome ---------- */
.hud {
  position: fixed; z-index: 10; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
  max-width: 380px; padding: 12px 16px; border-radius: 18px;
  background: var(--material); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: var(--float); pointer-events: none;
}
.hud * { pointer-events: auto; }
.hud .k { font-size: 12px; color: var(--text-2); font-weight: 500; }
.hud .k .ex { color: var(--orange); font-weight: 600; }
.hud .t { font-size: 22px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 1px 0 4px; overflow-wrap: anywhere; }
.hud .s { font-size: 13.5px; color: var(--text-2); display: flex; align-items: center; flex-wrap: wrap; gap: 0 6px; font-variant-numeric: tabular-nums; }
.hud .s b { color: var(--text); font-weight: 600; }
.hud .s i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.hud .c { font-size: 12px; color: var(--text-2); margin-top: 1px; font-variant-numeric: tabular-nums; }
.hud .src { display: inline-flex; align-items: center; gap: 5px; margin-right: 4px; color: var(--green); font-weight: 600; }
.hud .src[hidden] { display: none; }
.hud .src i { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--green-fill); }
.hud .src i b { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--green-fill); opacity: 0; }
.hud .src.lost { color: var(--red); }
.hud .src.lost i { background: var(--red-fill); }
.hud .b { font-size: 13px; margin-top: 8px; padding: 8px 12px; border-radius: 10px; }
.hud .b[hidden] { display: none; }
.hud .b.stop { background: var(--red-tint); color: var(--red); }
.hud .b.idle { background: var(--fill); color: var(--text-2); }
@media (max-width: 759px) {
  .hud { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); max-width: none; }
}

.dock { position: fixed; z-index: 10; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 8px; }
.fbtn {
  height: 44px; border: 0; border-radius: 22px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--material); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: var(--float); font-weight: 600; font-size: 15px; transition: transform 160ms var(--ease-out);
}
.fbtn:active { transform: scale(.97); }
.fbtn.icon { width: 44px; padding: 0; justify-content: center; }
.fbtn .count {
  display: inline-grid; overflow: hidden; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
  background: var(--orange-fill); color: var(--on-orange); font-size: 12.5px; font-weight: 700; line-height: 22px; text-align: center; font-variant-numeric: tabular-nums;
}
.fbtn .count[hidden] { display: none; }
.fbtn .count > span { grid-area: 1 / 1; }
.fbtn.quiet { color: var(--text-2); font-weight: 500; }

/* The detail sheet: a side panel on wide screens (the graph stays usable), a bottom sheet on phones (dims the rest).
   Its position is driven by a spring in the script, so it always moves from where it is. */
.sheet {
  position: fixed; z-index: 30; display: flex; flex-direction: column;
  background: var(--sheet-material); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: var(--lift); visibility: hidden; opacity: 0;
}
.sheet .grab { display: none; }
.sheet .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 4px; }
.sheet .kick { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ct, var(--text-2)); }
.sheet .dismiss { border: 0; border-radius: 8px; background: none; color: var(--blue); font-weight: 600; font-size: 16px; padding: 8px 6px; margin: -4px -6px -4px 0; cursor: pointer; transition: transform 160ms var(--ease-out); }
.sheet .dismiss:active { transform: scale(.97); }
.sheet .body { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 28px; }
.sheet h2 { font-size: 22px; line-height: 1.2; letter-spacing: -.022em; margin: 2px 0 0; font-weight: 700; }
.sheet .meta { margin-top: 8px; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.sheet .meta a { font-weight: 500; }
.sheet .meta b { color: var(--text); font-weight: 600; }
.sheet .facts { list-style: none; margin: 14px 0 0; padding: 0; font-size: 14px; }
.sheet .facts li { padding: 10px 0; border-top: .5px solid var(--sep); color: var(--text-2); }
.sheet .facts li b { color: var(--text); font-weight: 600; }
.btn { border: 0; border-radius: 11px; padding: 8px 16px; min-height: 36px; font-size: 14.5px; font-weight: 600; cursor: pointer; background: var(--blue-tint); color: var(--blue); transition: transform 160ms var(--ease-out); display: inline-flex; align-items: center; }
.btn:active { transform: scale(.97); }
.track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin: 14px 0 4px; }
.track span { font-size: 10.5px; color: var(--text-2); text-align: center; }
.track span::before { content: ""; display: block; height: 4px; border-radius: 2px; background: var(--fill); margin-bottom: 5px; }
.track span.done::before { background: color-mix(in srgb, var(--blue-fill) 45%, transparent); }
.track span.now { color: var(--blue); font-weight: 600; }
.track span.now::before { background: var(--blue-fill); }
.list { margin: 6px -18px 0; }
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 14px; gap: 0 12px; align-items: start; padding: 12px 16px; position: relative; width: 100%; border: 0; background: transparent; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: .5px solid var(--sep); }
/* A Ticket row opens through its ask alone, so the button's name is the ask; a layer stretched over
   the row keeps the whole row clickable, and the fields above that layer stay selectable. */
.row .open { display: block; width: 100%; padding: 0; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.row .open::after { content: ""; position: absolute; inset: 0; }
.row:has(.open):active { background: var(--fill); }
@media (hover: hover) and (pointer: fine) { .row:has(.open):hover { background: color-mix(in srgb, var(--fill) 55%, transparent); } }
.row .n { width: 24px; height: 24px; border-radius: 12px; background: var(--orange-fill); color: var(--on-orange); font-size: 12.5px; font-weight: 700; line-height: 24px; text-align: center; }
.row .n.red { background: var(--solid-red); color: #fff; }
.row .w { font-weight: 600; line-height: 1.35; }
.row .y { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.row .y.sum { color: var(--text); }
/* Labels run in at the start of their value, since the values are long and the sheet is narrow. */
.why { margin: 6px 0 0; font-size: 13px; line-height: 1.4; position: relative; z-index: 1; }
.why dt { display: inline; margin-right: 6px; color: var(--text-2); font-weight: 600; }
.why dd { display: inline; margin: 0; color: var(--text); overflow-wrap: anywhere; }
.why dd::after { content: ""; display: block; margin-bottom: 4px; }
.why dd.pick { font-weight: 600; }
.row .chev { color: var(--text-3); font-size: 20px; line-height: 1; }
.copyline { display: flex; gap: 8px; margin-top: 10px; position: relative; z-index: 1; }
.copyline code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; background: var(--fill); border-radius: 9px; padding: 8px 10px; }

@media (min-width: 760px) {
  .sheet { top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); width: 388px; max-height: calc(100dvh - 32px - 72px - env(safe-area-inset-bottom, 0px)); border-radius: 20px; } /* stops above the dock */
  .scrim { display: none; }
}
@media (max-width: 759px) {
  .sheet { left: 0; right: 0; bottom: 0; max-height: 82dvh; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); opacity: 1; }
  .sheet .grab { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--text-3); margin: 7px auto 0; }
  .sheet .head { touch-action: none; padding-top: 6px; cursor: grab; }
  .scrim { position: fixed; inset: 0; z-index: 29; background: var(--scrim); opacity: 0; pointer-events: none; }
  .scrim.open { pointer-events: auto; }
}
@media (prefers-reduced-motion: reduce) {
  /* Presses answer with a dim instead of a shrink; the script swaps every movement for a fade the same way. */
  .board .press, .fbtn, .sheet .dismiss, .btn { transition: opacity 160ms ease; }
  .fbtn:active, .sheet .dismiss:active, .btn:active, .board .node.pressed .press { transform: none; opacity: .6; }
}
@media (prefers-reduced-transparency: reduce) {
  .hud, .fbtn, .sheet { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  :root { --edge: rgba(60, 60, 67, .7); --sep: rgba(60, 60, 67, .5); }
  .hud, .fbtn, .sheet { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; border: 1px solid var(--sep); }
}

/* ---------- An open Ticket: what it is, before where it stands ---------- */
:root { --green-tint: rgba(52, 199, 89, .13); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --green-tint: rgba(48, 209, 88, .16); } }
:root[data-theme="dark"] { --green-tint: rgba(48, 209, 88, .16); }

.arow { margin-top: 20px; }
.arow h3, .sec h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.arow p { margin: 0; font-size: 15px; line-height: 1.5; }
.arow p.soft { color: var(--text-2); font-size: 14px; }
.done { list-style: none; margin: 0; padding: 0; font-size: 15px; line-height: 1.4; }
.done li { position: relative; padding: 4px 0 4px 26px; }
.done li::before { content: ""; position: absolute; left: 0; top: 5px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--text-3); }
.done.met li::before { background: var(--green-fill); border-color: var(--green-fill); }
.done.met li::after { content: ""; position: absolute; left: 6px; top: 8px; width: 3.5px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ba { display: grid; margin-top: 18px; }
.ba-card { padding: 10px 14px 12px; border-radius: 13px; }
.ba-card.before { background: var(--fill); }
.ba-card.after { background: var(--green-tint); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--green-fill) 32%, transparent); }
.ba-card p { margin: 3px 0 0; font-size: 15px; line-height: 1.42; }
.ba-card.before p { color: var(--text-2); }
.ba-k { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }

      if (e.spec.marker) e.el.setAttribute("marker-end", "url(#ar-" + (hi ? "hi" : "n") + ")");
    });
  }
  function choose(id, viaKey) {
    if (!id) { closeSheet(); return; }
    if (!S.m.byId[id]) return;
    S.sel = id;
    markSelected();
    openSheet("detail", id, false, viaKey);
    var p = S.board && S.board.spec && S.board.spec.center(id);
    if (p) requestAnimationFrame(function () { S.board.reveal(p, !viaKey); });
  }
  // What the person needs to decide an item without opening it: the answer recommended, the risk
  // of taking it, and the evidence it rests on. Each is optional, so older snapshots still show.
  function reasons(a) {
    var rows = [["Recommended", a.pick], ["Risk", a.risk], ["Evidence", a.evidence]].filter(function (r) { return r[1]; });
    if (!rows.length) return null;
    return el("dl", { "class": "why" }, rows.reduce(function (out, r) { return out.concat([el("dt", { text: r[0] }), el("dd", r[0] === "Recommended" ? { "class": "pick", text: r[1] } : { text: r[1] })]); }, []));
  }
  // The decision: what to answer, the pick, its risk, and the one button that acts on it. Evidence waits one tap away.
  function decisionCard(t, a) {
    var red = tone(t) === "stop";
    var kids = [el("span", { "class": "pill", text: red ? "Stuck · your answer" : "Needs you" }), el("p", { "class": "q", text: a.ask })];
    if (a.pick) kids.push(el("p", { "class": "pick" }, [el("span", { "class": "pk-k", text: "We recommend " }), el("b", { text: a.pick })]));
    if (a.risk) kids.push(el("p", { "class": "risk", text: "Risk: " + a.risk }));
    // One action per decision. An answer given in conversation has no button: the instruction is the action.
    var act = el("div", { "class": "act" }), button = null;
    if (t.pr && t.status === "held") button = link(t.pr.url, "Open PR " + t.pr.id, "btn go");
    else if (t.status === "grant") button = link(t.url, "Grant on the Ticket", "btn go");
    else if (!a.detail) button = link(t.url, "Open Ticket", "btn go");
    act.appendChild(button || el("span", { "class": "do", text: a.detail }));
    if (a.cost) act.appendChild(el("span", { "class": "cost", text: a.cost }));
    kids.push(act);
    if (button && a.detail) kids.push(el("p", { "class": "how", text: a.detail }));
    if (a.evidence) kids.push(el("details", { "class": "ev" }, [el("summary", { text: "What this rests on" }), el("p", { text: a.evidence })]));
    return el("div", { "class": "decide" + (red ? " red" : "") }, kids);
  }
  function copyLine(text) {
    var b = el("button", { type: "button", "class": "btn", text: "Copy" });
    b.addEventListener("click", function () {
      var ok = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1400); };
      try { navigator.clipboard.writeText(text).then(ok, function () { b.textContent = "Select it"; }); } catch (e) { b.textContent = "Select it"; }
    });
    return el("div", { "class": "copyline" }, [el("code", { text: text }), b]);
  }
  $("needsBtn").addEventListener("click", function (e) {
    if (!S.m || !S.d.needsYou.length) return;
    S.sel = null; markSelected();
    openSheet("needs", null, false, e.detail === 0);
  });
  $("fitBtn").addEventListener("click", function (e) { if (S.board) S.board.fit("all", e.detail !== 0); });
  $("sheetDone").addEventListener("click", function (e) { closeSheet(e.detail === 0); });
  // Only a press that starts on the scrim closes the sheet: the click a phone sends after the tap that opened it
  // lands on the scrim too, and must not close it again.
  var scrimDown = false;
  $("scrim").addEventListener("pointerdown", function () { scrimDown = true; });
  // The mouse press a phone sends after a tap lands on the scrim and would pull focus out of the sheet just opened.
  $("scrim").addEventListener("mousedown", function (e) { e.preventDefault(); });
  $("scrim").addEventListener("click", function () { if (scrimDown) closeSheet(); scrimDown = false; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sheet) closeSheet(true); });
  $("keyBtn").addEventListener("click", function (e) { S.sel = null; markSelected(); openSheet("key", null, false, e.detail === 0); });
  // A hover peek: the one-sentence summary beside the card, so scanning the graph explains it.
  function initPeek() {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    var pk = $("peek"), cur = null, hideT = 0, showT = 0, shown = false;
    function show(g) {
      var t = S.m && S.m.byId[g.getAttribute("data-id")];
      if (!t || S.sel === t.id) return hide();
      pk.textContent = "";
      pk.appendChild(el("div", { "class": "pk", text: t.id + (t.type ? " · " + TYPE_NAME[t.type] : "") }));
      pk.appendChild(el("div", { text: t.summary || t.title }));
      pk.appendChild(el("div", { "class": "ph", text: "Click for details" }));
      var r = g.getBoundingClientRect(), w = pk.offsetWidth || 290, x = r.right + 10, y = r.top;
      if (x + w > innerWidth - 12) x = r.left - w - 10;
      pk.classList.toggle("instant", !shown);
      pk.style.left = Math.round(x) + "px"; pk.style.top = Math.round(Math.max(12, Math.min(y, innerHeight - pk.offsetHeight - 12))) + "px";
      pk.style.transformOrigin = (x > r.left ? "left" : "right") + " top";
      pk.classList.add("on"); shown = true;
    }
    function hide() { pk.classList.remove("on"); shown = false; cur = null; }
    S.hidePeek = hide; // an opening sheet, or the board moving under a still pointer, must not leave a stale peek
    S.board.svg.addEventListener("pointerover", function (e) {
      var g = e.target.closest && e.target.closest("[data-id]");
      if (!g || S.board.svg.classList.contains("dragging")) return;
      clearTimeout(hideT);
      if (g === cur) return;
      cur = g; clearTimeout(showT);
      // The first peek waits a beat so passing over the graph is quiet; once one is open, the next follows at once.
      if (shown) show(g); else showT = setTimeout(function () { if (cur === g) show(g); }, 260);
    });
    S.board.svg.addEventListener("pointerout", function (e) {
      var to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-id]");
      if (to) return;
      clearTimeout(showT); hideT = setTimeout(hide, 80);
    });
    S.board.svg.addEventListener("pointerdown", hide);
    S.board.svg.addEventListener("wheel", hide, { passive: true });
  }
  window.addEventListener("resize", function () { Sheet.draw(); syncModal(); if (S.board) S.board.contain(); });

  /* ================= The one path every snapshot takes ================= */
  function strings(a) { return a == null || (Array.isArray(a) && a.every(function (x) { return typeof x === "string"; })); }
  function optStr(v) { return v == null || typeof v === "string"; }
  function oneOf(v, list) { return list.indexOf(v) >= 0; }
  var MODES = ["default", "autonomous"], STATES = ["running", "paused", "finished"], KINDS = ["debt", "refactor"];
  var PHASE_IDS = PHASES.map(function (p) { return p[0]; });
  // Data is untyped input, so it is checked here, where it enters; a bad snapshot keeps the last good view.
  function valid(d) {
    if (!d || typeof d !== "object" || d.schema !== 1 || !Array.isArray(d.tickets) || !Array.isArray(d.needsYou)) return false;
    if (!d.effort || typeof d.effort.name !== "string" || !optStr(d.effort.destination)) return false;
    if (!oneOf(d.mode, MODES) || !oneOf(d.state, STATES) || isNaN(Date.parse(d.checkedAt))) return false;
    if (typeof d.plan !== "number" || !isFinite(d.plan)) return false;
    if (d.nextCheckAt != null && isNaN(Date.parse(d.nextCheckAt))) return false;
    if (d.maxBatch != null && typeof d.maxBatch !== "number") return false;
    var ids = {};
    var ticketsOk = d.tickets.every(function (t) {
      if (!t || typeof t.id !== "string" || ids[t.id] || t.id === "goal" || typeof t.title !== "string" || typeof t.status !== "string" || !Object.prototype.hasOwnProperty.call(TONE, t.status)) return false;
      ids[t.id] = 1;
      if (!optStr(t.url) || !optStr(t.at) || !optStr(t.note) || !optStr(t.grant)) return false;
      if (!optStr(t.summary) || !optStr(t.why) || !optStr(t.foundWhile) || !strings(t.done)) return false;
      if (t.change != null && (typeof t.change !== "object" || typeof t.change.before !== "string" || typeof t.change.after !== "string")) return false;
      if (t.type != null && !Object.prototype.hasOwnProperty.call(TYPE_NAME, t.type)) return false;
      if ((t.phase != null && !oneOf(t.phase, PHASE_IDS)) || (t.kind != null && !oneOf(t.kind, KINDS)) || (t.auto != null && t.auto !== false)) return false;
      if (t.pr != null && (typeof t.pr !== "object" || typeof t.pr.id !== "string" || !optStr(t.pr.url))) return false;
      return strings(t.dependsOn) && strings(t.after) && strings(t.from);
    });
    return ticketsOk && d.needsYou.every(function (a) {
      return a && typeof a.ask === "string" && optStr(a.ticket) && optStr(a.detail) && optStr(a.cost) && optStr(a.startLine)
        && optStr(a.pick) && optStr(a.risk) && optStr(a.evidence);
    });
  }
  function apply(d, via, opts) {
    opts = opts || {};
    if (!valid(d)) { S.bad = true; console.warn("orchestrate-status: ignored a snapshot that does not match schema 1 (from " + via + ")"); tick(); return false; }
    S.bad = false;
    setClock(d);
    var json = JSON.stringify(d);
    if (json === S.json) { tick(); return true; }
    var first = !S.m, anim = !first && !opts.instant;
    S.json = json; S.d = d; S.m = model(d);
    renderHud(); tick(); renderNeeds(anim);
    render(S.board, flow(S.m), anim);
    if (first) {
      S.board.fit("load", false);
      if (S.board.svg.animate) S.board.svg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: CURVE.out });
    }
    markSelected();
    refreshSheet();
    if (anim) pulseLive();
    S.hudReady = true;
    return true;
  }

  /* ================= Data sources: the inline block first, then whatever live source the host offers ================= */
  function loadStatus() {
    return new Promise(function (resolve, reject) {
      try { resolve(JSON.parse($("orchestrate-status").textContent)); } catch (e) { reject(e); }
    });
  }
  function fetchSibling() {
    return fetch(new URL("orchestrate-status.json", location.href).href, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  // A file: page cannot fetch, so a sibling script sets window.ORCHESTRATE_STATUS and is re-read on each poll.
  var injected = null;
  function injectSibling() {
    return new Promise(function (resolve, reject) {
      if (injected) injected.remove();
      window.ORCHESTRATE_STATUS = undefined;
      var sc = document.createElement("script");
      sc.src = "orchestrate-status.js?t=" + Date.now();
      sc.onload = function () { var d = window.ORCHESTRATE_STATUS; if (d) resolve(d); else reject(new Error("orchestrate-status.js set no data")); };
      sc.onerror = function () { reject(new Error("orchestrate-status.js did not load")); };
      injected = sc;
      document.head.appendChild(sc);
    });
  }
  function poll(kind, get, onData, onState) {
    var had = false;
    function once() {
      get().then(function (d) { had = true; onData(d, kind); setTimeout(once, POLL_MS); }, function (err) {
        if (!had) { onState("none", "idle"); return; } // no sibling file: the page shows the inline data only
        console.warn("orchestrate-status: live " + kind + " source failed: " + err.message);
        onState(kind, "lost");
        setTimeout(once, POLL_MS);
      });
    }
    once();
  }
  function siblings(onData, onState, example) {
    // The example data has no sibling to read.
    if (example) { onState("none", "idle"); return; }
    if (/^https?:$/.test(location.protocol)) poll("http", fetchSibling, onData, onState);
    else if (location.protocol === "file:") poll("file", injectSibling, onData, onState);
    else onState("none", "idle");
  }
  function subscribe(onData, onState, example) {
    var use = null;
    try { if (window.claude && window.claude.use) use = Promise.resolve(window.claude.use("db")); } catch (e) { use = null; }
    if (!use) { siblings(onData, onState, example); return; }
    var timeout = new Promise(function (r) { setTimeout(function () { r(null); }, 10000); });
    Promise.race([use, timeout]).then(function (db) {
      if (!db) { siblings(onData, onState, example); return; }
      var retried = 0;
      function listen() {
        try {
          // Read-only: the orchestrator writes this document; the page never does.
          db.doc("status/current").onSnapshot(function (snap) { retried = 0; if (snap && snap.exists) onData(snap.data(), "db"); }, function (err) {
            var code = err && err.code;
            console.warn("orchestrate-status: live db source stopped: " + (err && err.message));
            onState("db", "lost");
            // A stalled bridge recovers only by subscribing again; a withdrawn grant does not recover.
            if (code === "unavailable" && retried < 5) { retried++; setTimeout(listen, 5000 * retried); }
          });
          onState("db", S.real.kind === "db" && S.real.state === "live" ? "live" : "idle");
        } catch (e) { console.warn("orchestrate-status: could not read the live db source: " + e.message); onState("db", "lost"); }
      }
      listen();
    }, function () { siblings(onData, onState, example); });
  }
  function onData(d, kind) { S.real = { kind: kind, state: apply(d, kind) ? "live" : "bad" }; tick(); }
  function onState(kind, state) { S.real = { kind: kind, state: state }; tick(); }

  /* ================= Start ================= */
  hudInit();
  S.board = makeBoard($("stage"), { label: "The effort's Tickets, ordered by what each waits on", onTap: choose });
  initPeek();
  Sheet.draw();
  function loop() { tick(); setTimeout(loop, 1000 - (Date.now() % 1000) + 5); }
  loadStatus().then(function (d) {
    if (!apply(d, "inline")) { S.hk.textContent = "The status data on this page does not have the expected shape."; return; }
    subscribe(onData, onState, !!d.example);
    loop();
    // Hooks for automated checks of this page; nothing on the page depends on them.
    window.__orchestrateStatus = {
      apply: function (x) { return apply(x, "check"); }, board: function () { return S.board; }, state: function () { return S; },
      skew: function (ms) { CLOCK.skew = ms; tick(); }, busy: function () { return Motion.busy() || Sheet.busy(); }
    };
  }, function (e) { S.hk.textContent = "The status data on this page could not be read: " + e.message; });
})();
</script>
</body>
</html>
